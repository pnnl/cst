name: Docker Image CI

on:
  push:
    branches: [ "dev" ]
  pull_request:
    branches: [ "dev" ]

jobs:

  build:
    name: Build Docker image and push to repositories
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
  
      - name: login to hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          
      - name: Build
        run: |
          cd scripts/docker
          # ls -las
          # git update-index --chmod=+x build_images.sh
          cat ./build_images.sh
          ./build_images.sh
          
      - name: Test
        run: |
          cd scripts
          ls -las
          # git update-index --chmod=+x build_images.sh
          cat ./integration_test.sh
          ./integration_test.sh

      - name: Publish
        run: |
          cd scripts
          ./publish_images.sh
